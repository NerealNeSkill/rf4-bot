VERSION: "0.11.0"
LANGUAGE: "ru"
KEY:                               # (Назначение клавиш)
  TEA: -1                          # (Чай)
  CARROT: -1                       # (Морковь)
  BOTTOM_RODS: [1, 2, 3]           # (Донные удилища)
  COFFEE: 4                        # (Кофе)
  DIGGING_TOOL: 5                  # (Лопата / Черпак)
  ALCOHOL: 6                       # (Алкоголь)
  MAIN_ROD: 1                      # (Основное удилище)
  NEXT_TICKET: "l"                # (Выбрать следующий билет на лодку; как в списке клавиш справа в игре)
  SPOD_ROD: 7                      # (Сподовое удилище)
  QUIT: "CTRL-C"                   # (Завершение работы)
  PAUSE: "["                       # (Пауза)
  FRICTION_BRAKE_RESET: "["        # (Сброс фрикциона)
  FRICTION_BRAKE_QUIT: "]"         # (Выход из настройки фрикциона)
  MOVE_PAUSE: "w"                  # (Пауза движения)
  MOVE_QUIT: "s"                   # (Остановка движения)

STAT:                              # (Показатели персонажа и напитки)
  ENERGY_THRESHOLD: 0.74           # (Порог энергии для питья)
  HUNGER_THRESHOLD: 0.5            # (Порог голода)
  COMFORT_THRESHOLD: 0.51          # (Порог комфорта)
  TEA_DRINK_DELAY: 300             # (Задержка питья чая)
  COFFEE_DRINK_DELAY: 32           # (Задержка питья кофе)
  COFFEE_LIMIT: 32                 # (Лимит порций кофе)
  COFFEE_PER_DRINK: 1              # (Количество порций кофе за раз)
  ALCOHOL_DRINK_DELAY: 900         # (Задержка питья алкоголя)
  ALCOHOL_PER_DRINK: 1             # (Количество порций алкоголя за раз)

BOT:                               # (Основной модуль бота)
  LAUNCH_OPTIONS: ""               # (Параметры запуска)
  SMTP_VERIFICATION: true          # (Проверка SMTP почты)
  SNAG_DETECTION: true             # (Детекция зацепа)
  SPOOLING_DETECTION: true         # (Детекция размота лески)
  WHEEL_BY_FILL: true              # (Конец смотки обычной лески по заполнению кольца иконки шпули (по цвету заливки), а не по шаблону: надёжнее на любом фоне. Только при отключённом HDR в игре. true - да, false - прежний способ по шаблону)
  WHEEL_RING_MAX_GAP: 0.036        # (С какого зазора в кольце считать леску смотанной, доля круга: 0.044 - около 5 м, 0.036 - около 4 м, 0.025 - около 3 м; меньше - подъём позже)
  ROD_PLACEMENT:                   # (Авто-расстановка донок на старте: бот сам забрасывает и ставит удилища на подставки. Отключить: флаг -SC)
    ENABLED: true                  # (Включено; false - как раньше, удочки расставлять вручную)
    STEP_SECONDS: 0.15             # (Длина одного шага в сторону, сек)
    MAX_TRIES: 3                   # (Сколько шагов-повторов на удочку при красной плашке, потом остановка)
    STEPS: [s, d, d]               # (Первый шаг по номеру ставимой удочки: 1-я - назад (s), 2-я и 3-я - вправо (d); дальше шаги чередуются с FALLBACK_STEP)
    FALLBACK_STEP: s               # (Запасной шаг, если первого мало)
    SHIFT_BEFORE_CAST: ["", d, d]  # (Шаг ПОСЛЕ постановки предыдущей удочки и ДО заброса следующей, по номеру забрасываемой: 1-я без шага, 2-я и 3-я вправо. "" - без шага)
    SHIFT_BEFORE_CAST_SECONDS: 0.4 # (Длина шага перед забросом, сек. Шаги-повторы после красной плашки растут на 50% с каждой попыткой от STEP_SECONDS)
  SPOOL_CONFIDENCE: 0.93           # (Точность определения размота)
  SPOOL_RETRIEVAL_DELAY: 2.0       # (Задержка вываживания при размоте)
  RAINBOW_RETRIEVAL_DELAY: 2.0     # (Задержка вываживания при «радуге»)
  RANDOM_CAST_PROBABILITY: 0.06   # (Вероятность случайного заброса)
  SPOD_ROD_RECAST_DELAY: 1800      # (Интервал перезаброса спода)
  LURE_CHANGE_DELAY: 1800          # (Интервал смены приманки)
  PAUSE_DELAY: 1800                # (Интервал между паузами)
  GEAR_RATIO_DELAY: 64             # (Интервал изменения передаточного числа)
  PAUSE_DURATION: 600              # (Длительность паузы)
  CLICK_LOCK: false
  CATCH_SCREEN_STYLE: "simple"
  JITTER_SCALE: 0.2                # (Масштаб случайных отклонений)
  PULL_FALLBACK_DELAY: 20.0        # (Таймаут fallback вываживания)
  
  KEEPNET:                         # (Настройки садка)
    CAPACITY: 100                  # (Вместимость садка)
    SCREENSHOT_EVENTS: ["fish", "card", "gift"] # (События для скриншота: рыба, карточка, подарок)
    SCREENSHOT_TAGS: ["yellow", "blue"]         # (Теги для скриншота)
    BYPASS_TAGS: ["yellow", "blue"]             # (Теги обхода)
    BLACKLIST: []                  # (Черный список рыбы)
    WHITELIST: ["mackerel", "saithe", "herring", "squid", "scallop", "mussel"] # (Белый список рыбы)
    KEEP_TAGS: ["green", "yellow", "blue", "purple", "pink"] # (Теги для сохранения в садок)
    
  NOTIFICATION:                   # (Уведомления)
    EMAIL: "email@example.com"     # (Email получателя)
    PASSWORD: "password"           # (Пароль почты)
    SMTP_SERVER: "smtp.gmail.com"  # (Сервер SMTP)
    MIAO_CODE: ""                  # (Код Miao)
    DISCORD_WEBHOOK_URL: ""        # (URL вебхука Discord)
    TELEGRAM_BOT_TOKEN: ""         # (Токен Telegram-бота)
    TELEGRAM_CHAT_ID: -1           # (ID чата Telegram)
    
  FRICTION_BRAKE:                  # (Управление фрикционом)
    # ===== Диапазон фрикциона (на катушке 30 делений, минимум всегда 0) =====
    INITIAL: 22                    # (Значение, на которое фрикцион возвращается перед забросом)
    MAX: 25                        # (Выше этого значения бот фрикцион не поднимет)

    # ===== Шкала натяжения =====
    # Заливка растёт от центра экрана в обе стороны, доля 1.0 - край шкалы.
    # Разделители: 0.50 (начало жёлтой/оранжевой) и 0.75 (начало красной).
    # Не ставьте доли в 0.48-0.52 и 0.73-0.77: там серый разделитель, точка не загорится.
    # Должно быть: GREEN_FROM < AMBER_FROM < 0.75 и AMBER_FROM < точки сброса.
    GREEN_FROM: 0.15               # (Слежение за зелёной зоной: с какой доли шкалы считается, что рыба тянет. Меньше - бот замечает более слабую нагрузку. Заливка короче - шкала пустая, прибавки нет)
    AMBER_FROM: 0.55               # (С какой доли шкалы бот считает зону жёлтой/оранжевой)

    # ===== Сброс (убавление) фрикциона =====
    # Красная зона и точка сброса - это РАЗНЫЕ вещи.
    #   Красная зона начинается с 78% шкалы (сразу за вторым разделителем): так шкала краснеет в игре.
    #   Точка сброса - с какой доли бот начинает убавлять фрикцион. Её задаёт SENSITIVITY.
    # SENSITIVITY: чем выше чувствительность, тем раньше сброс:
    #   very_high - сброс с 70% шкалы (ещё в жёлтой зоне, до красной)
    #   high      - 80% (красная зона уже идёт, но сброс стартует с небольшой задержкой по длине: между 78% и 80%)
    #   medium    - 90% (между 78% и 90% шкала красная, бот ничего не делает)
    #   low       - 95% (между 78% и 95% шкала красная, бот ничего не делает)
    # Пока заливка в красной зоне, но ещё не дошла до точки сброса, бот не прибавляет и не сбрасывает.
    # При запуске в логе пишется строка "Friction brake bar zones: ..." с реальными порогами.
    SENSITIVITY: "high"
    # OVERLOAD_FROM: 0.85          # (Точная доля шкалы для начала сброса; если раскомментировать, заменяет SENSITIVITY. Допустимо 0.05-0.98, не ставьте 0.73-0.77; прежнее имя RED_FROM тоже работает)
    DECREASE_STEP: 1               # (На сколько делений сбрасывать за один раз)
    DECREASE_DELAY: 1.0            # (Пауза после сброса, с: чтобы шкала успела отреагировать)
    BURNING_DECREASE: true         # (Сбрасывать при значке перегрева катушки в любой зоне; false - при перегреве только не прибавлять)

    # ===== Прибавка фрикциона =====
    START_DELAY: 2.0               # (Пауза после поклёвки, прежде чем регулятор начнёт работать, с)
    INCREASE_STEP: 1               # (На сколько делений прибавлять за один раз, в любой зоне)
    ORANGE_INCREASE: true          # (Прибавлять в жёлтой/оранжевой зоне: true/1 - да, false/0 - нет)
    INCREASE_DELAY: 2.0            # (Сколько секунд шкала должна непрерывно быть в жёлтой/оранжевой зоне до каждой прибавки)
    GREEN_INCREASE: false          # (Прибавлять в зелёной зоне: true/1 - да, false/0 - нет; для рыб, которые не дотягивают шкалу до жёлтой)
    GREEN_INCREASE_DELAY: 3.0      # (Сколько секунд шкала должна непрерывно быть в зелёной зоне до каждой прибавки)

    # ===== Защита от повторной перегрузки =====
    LIMIT_RELAX_DELAY: 10.0        # (После сброса бот не прибавляет выше значения, на котором был сброс; каждые N секунд без перегрузки этот потолок растёт на 1, до MAX)

    # ===== Служебное =====
    POLL_DELAY: 0.1                # (Как часто бот смотрит на шкалу во время вываживания, с)
    IDLE_POLL_DELAY: 0.5           # (Как часто бот проверяет, есть ли рыба на крючке, пока рыбы нет, с; больше - меньше нагрузка на экран, но позже заметит поклёвку)
    FULL_RESYNC_EVERY: 30          # (Полный сброс до упора и обратно раз в N+забросов + рандом 20% чтобы убрать рассинхрон; 0 - только первый раз. В остальные забросы докручивается только разница до INITIAL)

    
     # Ключ PULL_FALLBACK_DELAY остаётся в секции BOT без изменений: он работает как раньше,
  # если шкала натяжения недоступна (нестандартный размер окна) или ENABLE_TENSION_FALLBACK: false.
  PULL:                            # (Фолбэки при вываживании по шкале натяжения)
    ENABLE_TENSION_FALLBACK: true  # (Решать по шкале натяжения: true/1 - да, false/0 - только прежний таймер PULL_FALLBACK_DELAY)
    EMERGENCY_DELAY: 180.0         # (Аварийный таймаут вываживания при включённой шкале, с; 0 - выкл. Срабатывает, только если ни одно условие ниже не сработало раньше)
    LOG_STATE: true                # (Писать в лог смену состояния шкалы: "Pull state: fish=... zone=0..3 fill=...px". Зоны: 0 пусто, 1 зелёная, 2 жёлтая/оранжевая, 3 красная)

    # ===== Рыба на крючке, а натяжение минимальное -> подъём удилища (lift) =====
    # Это замена прежнего таймера в 20 секунд: теперь удилище поднимается не по времени вообще,
    # а когда рыба на крючке и шкала долго остаётся почти пустой.
    LOW_TENSION_FALLBACK: true     # (Включить это условие: true/1 - да, false/0 - нет)
    LOW_TENSION_MAX: 0.15          # (Ниже какой доли шкалы натяжение считается минимальным. Доля от центра до края шкалы, 1.0 - край. Больше - условие срабатывает чаще)
    LOW_TENSION_DELAY: 12.0        # (Сколько секунд подряд рыба на крючке при минимальном натяжении до подъёма. Бои в ваших логах идут от 7 до 20 с, поэтому 5-8 с будут поднимать удилище раньше обычного)
    LOW_TENSION_BREAK_SAMPLES: 2   # (Сколько замеров подряд (около 0.5 с каждый) вне условия начинают отсчёт заново; один выброс игнорируется. Пропажа значка рыбы сбрасывает отсчёт сразу)

    # ===== Рыбы нет, а шкала красная -> зацеп =====
    SNAG_BY_TENSION: true          # (Включить это условие: true/1 - да, false/0 - нет)
    SNAG_LOG_ONLY: true            # (true - только писать в лог "Snag by tension", бот продолжает работать. false - поднять LineSnaggedError: при одном удилище это завершает бота. Сначала понаблюдайте за логом, нет ли ложных срабатываний)
    SNAG_RED_FROM: 0.78            # (С какой доли шкалы заливка считается красной: 0.78 - сразу за вторым разделителем, там шкала в игре краснеет. Не ставьте 0.73-0.77: там разделитель)
    SNAG_CONFIRM_DELAY: 3.0        # (Сколько секунд подряд должно держаться условие "нет рыбы и красная шкала")
    SNAG_CONFIRM_SAMPLES: 3        # (Минимум замеров подряд за это время; любой замер вне условия начинает отсчёт заново)

    # ===== Служебное =====
    LIFT_DURATION: 3.0             # (Базовая длительность удержания ПКМ при раскачивании, с. Рандомизируется ±25%: при 3.0 будет 2.25-3.75)
    LIFT_RELEASE_DELAY: 3.0        # (Базовая пауза между раскачиваниями, с. Рандомизируется ±25%: при 3.0 будет 2.25-3.75)
    
    # ===== Смотка закончена (рыба у кончика удилища) -> подсак =====
    NET_AFTER_FINISH_DELAY: 0.6    # (Сколько секунд поднимать удилище после конца смотки, прежде чем достать подсак; ждать таймаут подъёма не нужно. 0 - прежнее поведение: подсак только по таймауту подъёма. Если рыба срывается/выдёргивается до подсака - уменьшайте, если подсак раньше времени - увеличивайте. Для тяжёлой рыбы на донках 1-2 с)

CRAFT:                             # (Крафтинг)
  LAUNCH_OPTIONS: ""               # (Параметры запуска)

MOVE:                              # (Перемещение)
  LAUNCH_OPTIONS: ""               # (Параметры запуска)

HARVEST:                           # (Добыча наживки)
  LAUNCH_OPTIONS: ""               # (Параметры запуска)
  POWER_SAVING: false              # (Режим энергосбережения)
  CHECK_DELAY: 32                  # (Задержка проверки)

PROFILE:
  SPIN:                          # (Спиннинг | Равномерная проводка)
    DESCRIPTION: "Default spin fishing."  # (Стандартная спиннинговая ловля)
    LAUNCH_OPTIONS: ""           # (Параметры запуска)
    MODE: "spin"                 # (Режим: Спиннинг)
    TYPE: "normal"               # (Тип проводки: Равномерная)
    CAST_POWER_LEVEL: 5.0        # (Сила заброса)
    CAST_DELAY: 6.0              # (Задержка после заброса)
    TIGHTEN_DURATION: 0.0        # (Время натяжения лески)
    RETRIEVAL_DURATION: 0.0      # (Длительность подмотки)
    RETRIEVAL_DELAY: 0.0         # (Задержка между подмотками)
    RETRIEVAL_TIMEOUT: 256.0     # (Таймаут проводки)
    RESET_ACCELERATION: false    # (Сброс ускорения)
    PRE_ACCELERATION: false      # (Ускорение до подмотки)
    POST_ACCELERATION: false     # (Ускорение после подмотки)
    LIFT_TIMEOUT: 16.0           # (Таймаут подъема удилища)
    
  SPIN_WITH_PAUSE:                # (Спиннинг | Проводка с паузой (Stop & Go))
    DESCRIPTION: "Spin fishing, short pauses."  # (Спиннинговая ловля, короткие паузы)
    LAUNCH_OPTIONS: ""           # (Параметры запуска)
    MODE: "spin"                 # (Режим: Спиннинг)
    TYPE: "pause"                # (Тип проводки: Пауза)
    CAST_POWER_LEVEL: 5.0        # (Сила заброса)
    CAST_DELAY: 6.0              # (Задержка после заброса)
    TIGHTEN_DURATION: 1.0        # (Время натяжения лески)
    RETRIEVAL_DURATION: 1.0      # (Длительность подмотки)
    RETRIEVAL_DELAY: 3.0         # (Задержка между подмотками)
    RETRIEVAL_TIMEOUT: 256.0     # (Таймаут проводки)
    RESET_ACCELERATION: false    # (Сброс ускорения)
    PRE_ACCELERATION: false      # (Ускорение до подмотки)
    POST_ACCELERATION: false     # (Ускорение после подмотки)
    LIFT_TIMEOUT: 10.0           # (Таймаут подъема удилища)

  SPIN_WITH_LIFT:                 # (Спиннинг | Проводка с подтяжкой)
    DESCRIPTION: "Spin fishing, short lifts."  # (Спиннинговая ловля, короткие подтяжки)
    LAUNCH_OPTIONS: ""           # (Параметры запуска)
    MODE: "spin"                 # (Режим: Спиннинг)
    TYPE: "lift"                 # (Тип проводки: Подтяжка)
    CAST_POWER_LEVEL: 5.0        # (Сила заброса)
    CAST_DELAY: 6.0              # (Задержка после заброса)
    TIGHTEN_DURATION: 0.0        # (Время натяжения лески)
    RETRIEVAL_DURATION: 1.0      # (Длительность подмотки)
    RETRIEVAL_DELAY: 1.0         # (Задержка между подмотками)
    RETRIEVAL_TIMEOUT: 256.0     # (Таймаут проводки)
    RESET_ACCELERATION: false    # (Сброс ускорения)
    PRE_ACCELERATION: false      # (Ускорение до подмотки)
    POST_ACCELERATION: false     # (Ускорение после подмотки)
    LIFT_TIMEOUT: 16.0           # (Таймаут подъема удилища)

  BOTTOM:                        # (Донная | Стандартная (Фидер / Карповое))
    DESCRIPTION: "Default bottom fishing."  # (Стандартная донная ловля)
    LAUNCH_OPTIONS: ""           # (Параметры запуска)
    MODE: "bottom"               # (Режим: Донная)
    CAST_POWER_LEVEL: 5.0        # (Сила заброса)
    CAST_DELAY: 4.0              # (Задержка после заброса)
    POST_ACCELERATION: false     # (Ускорение после подмотки)
    CHECK_DELAY: 16.0            # (Пауза перед проверкой поклевки)
    CHECK_MISS_LIMIT: 16         # (Лимит холостых проверок)
    PUT_DOWN_DELAY: 2.0          # (Задержка укладки на подставку)
    RANDOM_ROD_SELECTION: true   # (Случайный выбор удилища)
    ROD_COUNT: 3                 # (Сколько донных удилищ проверять: берутся первые N клавиш из KEY.BOTTOM_RODS. 2 - третье не опрашивается. Не больше длины BOTTOM_RODS)
    LIFT_TIMEOUT: 10.0           # (Таймаут подъема удилища)

  PIRK:                          # (Морская | Пилкинг в придонном слое)
    DESCRIPTION: "Default marine fishing, strong pirking at the bottom layer."  # (Стандартная морская ловля, сильный пилкинг у дна)
    LAUNCH_OPTIONS: ""           # (Параметры запуска)
    MODE: "pirk"                 # (Режим: Пилкинг)
    CAST_POWER_LEVEL: 1.0        # (Сила заброса)
    CAST_DELAY: 4.0              # (Задержка после заброса)
    SINK_TIMEOUT: 60.0           # (Таймаут погружения приманки)
    TIGHTEN_DURATION: 1.0        # (Время натяжения лески)
    DEPTH_ADJUST_DELAY: 4.0      # (Пауза регулировки глубины)
    DEPTH_ADJUST_DURATION: 1.0   # (Время регулировки глубины)
    CTRL: false                  # (Использование Ctrl)
    SHIFT: false                 # (Использование Shift)
    PIRK_DURATION: 0.9           # (Длительность рывка пилкинга)
    PIRK_DELAY: 2.0              # (Пауза между рывками)
    PIRK_TIMEOUT: 32.0           # (Таймаут цикла пилкинга)
    PIRK_RETRIEVAL: false        # (Подмотка во время пилкинга)
    HOOK_DELAY: 0.5              # (Задержка подсечки)
